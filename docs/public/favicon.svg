<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Hexagon shape -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="url(#grad)" opacity="0.15"/>
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
  <!-- Stylized "A" lines -->
  <line x1="16" y1="7" x2="10" y2="22" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="7" x2="22" y2="22" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="17" x2="20" y2="17" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
</svg>
