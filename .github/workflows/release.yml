name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  test:
    name: Test (unit + E2E on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (KMP allTests)
        working-directory: kit-setup
        run: ./gradlew allTests

      - name: Build Linux release binary for E2E
        working-directory: kit-setup
        run: ./gradlew :modules:cli:linkReleaseExecutableLinuxX64

      - name: Run E2E tests
        working-directory: kit-setup
        run: |
          KIT_BIN="$(pwd)/modules/cli/build/bin/linuxX64/releaseExecutable/cli.kexe"
          chmod +x "$KIT_BIN"
          ./gradlew :modules:e2e:test -Pkit.binary="$KIT_BIN"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            kit-setup/modules/*/build/reports/tests/
            kit-setup/modules/*/build/test-results/

  build-linux:
    name: Build (Linux x64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Linux binary
        working-directory: kit-setup
        run: ./gradlew :modules:cli:linkReleaseExecutableLinuxX64

      - name: Rename binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp kit-setup/modules/cli/build/bin/linuxX64/releaseExecutable/cli.kexe "kit-setup-${VERSION}-linux-amd64"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: kit-setup-*-linux-amd64

  build-macos:
    name: Build (macOS ARM64)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS binary
        working-directory: kit-setup
        run: ./gradlew :modules:cli:linkReleaseExecutableMacosArm64

      - name: Rename binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp kit-setup/modules/cli/build/bin/macosArm64/releaseExecutable/cli.kexe "kit-setup-${VERSION}-macos-arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: kit-setup-*-macos-arm64

  build-windows:
    name: Build (Windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows binary
        working-directory: kit-setup
        run: ./gradlew.bat :modules:cli:linkReleaseExecutableMingwX64

      - name: Rename binary
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          Copy-Item kit-setup/modules/cli/build/bin/mingwX64/releaseExecutable/cli.exe "kit-setup-${VERSION}-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: kit-setup-*-windows-amd64.exe

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Mark binaries executable
        run: chmod +x dist/kit-setup-*-linux-amd64 dist/kit-setup-*-macos-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
