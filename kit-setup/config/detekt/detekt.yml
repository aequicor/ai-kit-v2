complexity:
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15

style:
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
    ignoreRanges: true
    ignoreExtensionFunctions: true
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 140

naming:
  FunctionNaming:
    # allow backtick-quoted test names
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*|`[^`]+`'
